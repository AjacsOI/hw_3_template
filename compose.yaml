services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      PORT: 8000
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
    volumes:
      - counter_data:/data
    restart: unless-stopped

volumes:
  counter_data:
